# /etc/nginx/sites-available/hotel-pms
server {
    listen 80;
    listen [::]:80;
    server_name _;            # cambia "_" por tu dominio (ej. pms.mihotel.mx) si lo tienes

    root /var/www/hotel-pms;  # frontend compilado (npm run build -> frontend/dist)
    index index.html;

    # API -> backend Node en el puerto 4000
    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Archivos estáticos con caché larga (Vite genera nombres con hash)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta del frontend (/panel, /reservas…) devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
